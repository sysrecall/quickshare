[package]
name = "quickshare"
version = "0.3.1"
edition = "2024"

[dependencies]
qrcode = "0.14.1"
image = "0.25.9"
rand = "0.10.0"
show-image = "0.14.1"
interprocess = { version = "2.4.0", features = ["tokio"] }
anyhow = "1.0.102"
crossbeam = "0.8.4"
tokio = { version = "1.50.0", features = ["full"] }
axum = "0.8.8"
tokio-util = { version = "0.7.18", features = ["io"] }

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Security",
    "Win32_System_Threading"
]
