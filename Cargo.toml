[package]
name = "quickshare"
version = "0.2.1"
edition = "2024"

[dependencies]
actix-web = "4"
actix-files = "0.6"
serde = { version = "1.0.228", features = ["derive"] }
qrcode = "0.14.1"
image = "0.25.9"
rand = "0.10.0"
show-image = "0.14.1"
actix-rt = "2.11.0"
interprocess = { version = "2.4.0", features = ["tokio"] }
anyhow = "1.0.102"
crossbeam = "0.8.4"
tokio = { version = "1.50.0", features = ["full"] }
futures = "0.3.32"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Security",
    "Win32_System_Threading"
]
